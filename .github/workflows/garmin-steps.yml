name: Garmin steps

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch steps from Garmin
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/fetch-garmin-steps.py

      - name: Publish garmin-steps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp garmin-steps.json /tmp/garmin-steps.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/garmin-steps.json garmin-steps.json
            git add garmin-steps.json
            if git diff --cached --quiet; then
              echo "No step changes"
              exit 0
            fi
            git commit -m "Refresh daily steps, calories and workouts from Garmin."
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, retry ${attempt}"
          done
          exit 1
